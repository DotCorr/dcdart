<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Dotcorr mark — black variant (transparent bg).
    Geometry bounding box in original coords: x[-72..164] y[46..206]
    => w=236, h=160, center=(46, 126).
    Scale 1.9 → 448×304 inside 512×512 canvas (≈32px side padding,
    ≈104px top/bottom padding for optical balance with horizontal subject).
    Translate so geometry center maps to (256, 256):
      tx = 256 - 46  * 1.9 = 168.6
      ty = 256 - 126 * 1.9 = 16.6
  -->
  <g transform="translate(168.6 16.6) scale(1.9)">
    <path d="M 30 90 Q -20 110 -60 150 Q -80 170 -70 185" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M 30 90 Q -15 125 -45 172 Q -55 192 -42 205" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="60" cy="82" rx="38" ry="28" fill="#111"/>
    <ellipse cx="58" cy="68" rx="28" ry="10" transform="rotate(-20 58 68)" fill="#111"/>
    <circle cx="92" cy="68" r="22" fill="#111"/>
    <rect x="112" y="64" width="52" height="7" rx="3.5" fill="#111"/>
    <circle cx="97" cy="63" r="7" fill="white"/>
    <circle cx="99" cy="63" r="4" fill="#111"/>
    <ellipse cx="60" cy="90" rx="14" ry="10" fill="white" fill-opacity="0.3"/>
  </g>
</svg>
