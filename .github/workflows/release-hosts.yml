name: Build and verify release candidate
on:
  push:
    branches: [codex/dcdart-web-playground]
    paths: ['tools/release/**', 'core/**', '.github/workflows/release-hosts.yml']
  workflow_dispatch:
    inputs:
      distribution_trust:
        description: Require macOS signing/notarization and Windows Authenticode (credentials required)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release attribution
        run: python tools/release/check-attribution.py origin/main..HEAD
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-src
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Select LLVM on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm lld coreutils
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Restore pinned frontend
        shell: bash
        run: |
          cp core/scripts/vendor-frontend.sh release-src/core/scripts/vendor-frontend.sh
          bash release-src/core/scripts/vendor-frontend.sh
      - name: Build packaged compiler and execute native smoke test
        run: python tools/release/package.py release-src dist --stage-only
      - name: Locate verified staging directory
        id: stage
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          stages = list(Path('dist').glob('dcdart-*/provenance.json'))
          assert len(stages) == 1, stages
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('path=' + stages[0].parent.as_posix() + '\n')
          PY
      - name: Sign and notarize macOS distribution
        if: inputs.distribution_trust && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
          STAGE: ${{ steps.stage.outputs.path }}
        run: bash tools/release/sign-macos.sh "$STAGE"
      - name: Authenticate Windows signing through OIDC
        if: inputs.distribution_trust && runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows distribution
        if: inputs.distribution_trust && runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/${{ steps.stage.outputs.path }}/core/dcc/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify final executable and package final bytes
        shell: bash
        env:
          REQUIRE_TRUST: ${{ inputs.distribution_trust }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DCDART_WINDOWS_PUBLISHER: ${{ vars.DCDART_WINDOWS_PUBLISHER }}
          STAGE: ${{ steps.stage.outputs.path }}
        run: |
          args=()
          if [ "$REQUIRE_TRUST" = true ]; then args+=(--require-trust); fi
          python tools/release/finalize.py "$STAGE" "${args[@]}"
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -f "$archive" ] || continue
            python tools/release/check-archive.py "$archive" "${args[@]}"
          done
      - name: Run compiler conformance and optimizer tests
        if: runner.os != 'Windows'
        shell: bash
        working-directory: release-src
        run: |
          for package in dc-objdump dc-elide backend; do
            (cd core/$package && dart pub get)
          done
          bash core/tests/run-conformance.sh | tee conformance.log
          grep -q "0 failed, 0 skipped" conformance.log
          (cd core/dc-elide && dart test)
          (cd core/backend && dart test)
      - uses: actions/upload-artifact@v4
        with:
          name: dcdart-${{ inputs.distribution_trust && 'distribution' || 'development' }}-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
